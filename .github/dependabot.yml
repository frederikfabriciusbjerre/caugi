version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # One grouped PR a month: each needs src/rust/vendor.tar.xz re-vendored
  # (see AGENTS.md).
  - package-ecosystem: "cargo"
    directory: "/src/rust"
    schedule:
      interval: "monthly"
    groups:
      cargo:
        patterns: ["*"]
