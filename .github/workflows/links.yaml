# Weekly rather than per PR, so a flaky external site never blocks a merge.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: links.yaml

permissions: read-all

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3
            README.md CONTRIBUTING.md 'vignettes/*.Rmd' 'man/*.Rd'
